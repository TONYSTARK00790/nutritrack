<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NutriTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    h1,h2,.font-display { font-family: 'Syne', sans-serif; }
    .nt-input {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #e5e7eb;
      background: white; color: #1f2937; font-size: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nt-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
    .bg-mesh {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 30%, #f0f9ff 70%, #eff6ff 100%);
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp 0.6s ease forwards; }
  </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">
  <!-- Decorative blobs -->
  <div class="fixed top-0 left-0 w-96 h-96 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 -translate-x-1/2 -translate-y-1/2"></div>
  <div class="fixed bottom-0 right-0 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 translate-x-1/2 translate-y-1/2"></div>
  
  <div class="w-full max-w-md fade-up" style="animation-delay:0.1s">
    <!-- Card -->
    <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl border border-white/60 p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl shadow-lg mb-4 float">
          <span class="text-white font-display font-bold text-2xl">N</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to your NutriTrack account</p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="mb-4 px-4 py-3 rounded-xl {% if message.tags == 'success' %}bg-green-50 text-green-700 border border-green-100{% else %}bg-red-50 text-red-700 border border-red-100{% endif %} text-sm">
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <input type="text" name="username" class="nt-input" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" class="nt-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        {% if form.errors %}
        <p class="text-red-600 text-sm bg-red-50 px-4 py-2 rounded-xl border border-red-100">Invalid username or password. Please try again.</p>
        {% endif %}
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-sm hover:shadow-green-500/25 hover:shadow-lg active:scale-[0.98] mt-2">
          Sign In
        </button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <div class="relative text-center"><span class="px-3 bg-white/80 text-sm text-gray-400">or</span></div>
      </div>

      <p class="text-center text-sm text-gray-500">
        Don't have an account?
        <a href="{% url 'accounts:register' %}" class="text-green-600 hover:text-green-700 font-semibold ml-1">Create account →</a>
      </p>
    </div>
  </div>
</body>
</html>
