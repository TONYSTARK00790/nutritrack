<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#grainGrad)" opacity="0.15"/>
  <g transform="translate(100, 100)">
    <!-- Wheat stalk -->
    <line x1="0" y1="30" x2="0" y2="-35" stroke="#8B6F47" stroke-width="3" stroke-linecap="round"/>
    <!-- Left grain -->
    <g transform="translate(-15, -10)">
      <ellipse cx="0" cy="0" rx="6" ry="10" fill="#F39C12" stroke="#D68910" stroke-width="1.5" transform="rotate(-45)"/>
      <circle cx="-4" cy="-3" r="3" fill="#FDB913"/>
    </g>
    <!-- Center grain -->
    <g transform="translate(0, -25)">
      <ellipse cx="0" cy="0" rx="6" ry="11" fill="#F39C12" stroke="#D68910" stroke-width="1.5"/>
      <circle cx="0" cy="-5" r="3" fill="#FDB913"/>
    </g>
    <!-- Right grain -->
    <g transform="translate(15, -10)">
      <ellipse cx="0" cy="0" rx="6" ry="10" fill="#F39C12" stroke="#D68910" stroke-width="1.5" transform="rotate(45)"/>
      <circle cx="4" cy="-3" r="3" fill="#FDB913"/>
    </g>
  </g>
</svg>