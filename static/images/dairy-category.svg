<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dairyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDD835;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57F17;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#dairyGrad)" opacity="0.15"/>
  <g transform="translate(100, 100)">
    <!-- Milk glass -->
    <path d="M -16 -18 L -20 32 Q -20 38 -14 38 L 14 38 Q 20 38 20 32 L 16 -18 Z" fill="none" stroke="#F57F17" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Milk inside -->
    <path d="M -14 0 L -18 32 Q -18 36 -14 36 L 14 36 Q 18 36 18 32 L 16 0 Z" fill="#FFF9E6" opacity="0.9"/>
    
    <!-- Milk top foam -->
    <ellipse cx="0" cy="-5" rx="16" ry="6" fill="#FFFDE7" stroke="#FFD54F" stroke-width="1.5"/>
    <circle cx="-8" cy="-8" r="3.5" fill="#FFFDE7" stroke="#FFD54F" stroke-width="1" opacity="0.8"/>
    <circle cx="6" cy="-9" r="3" fill="#FFFDE7" stroke="#FFD54F" stroke-width="1" opacity="0.8"/>
    
    <!-- Handle -->
    <path d="M 20 -5 Q 40 5, 25 25" fill="none" stroke="#F57F17" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Shine highlight -->
    <ellipse cx="-8" cy="8" rx="4" ry="10" fill="#FFF9E6" opacity="0.5"/>
  </g>
</svg>