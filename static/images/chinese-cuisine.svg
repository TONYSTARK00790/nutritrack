<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chineseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A00020;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#chineseGrad)" opacity="0.15"/>
  
  <!-- Takeout box with chopsticks -->
  <g transform="translate(100, 100)">
    <!-- Box -->
    <path d="M -30 -15 L 30 -15 L 35 30 L -35 30 Z" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
    <!-- Box lid fold -->
    <path d="M -30 -15 L 0 0 L 30 -15" fill="#FF1744" stroke="#8B0000" stroke-width="2"/>
    <!-- Noodles inside -->
    <path d="M -20 5 Q -10 15, 0 12 Q 10 10, 20 18" stroke="#FDB750" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -15 20 Q -5 12, 5 20" stroke="#FDB750" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 10 Q 8 22, 15 15" stroke="#FDB750" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Chopsticks -->
    <line x1="-5" y1="-50" x2="10" y2="25" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="-50" x2="-10" y2="25" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>