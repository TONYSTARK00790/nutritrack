<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#fruitGrad)" opacity="0.15"/>
  <g transform="translate(100, 100)">
    <!-- Apple -->
    <circle cx="-15" cy="-5" r="18" fill="#E91E63" stroke="#C2185B" stroke-width="2"/>
    <!-- Apple stem -->
    <line x1="-15" y1="-25" x2="-15" y2="-35" stroke="#6B4C41" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Apple leaf -->
    <ellipse cx="-8" cy="-30" rx="8" ry="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
    
    <!-- Orange -->
    <circle cx="18" cy="5" r="16" fill="#FF9100" stroke="#E65100" stroke-width="2"/>
    <!-- Orange segments hint -->
    <circle cx="18" cy="5" r="14" fill="none" stroke="#FFB74D" stroke-width="1.5" opacity="0.5"/>
    <line x1="18" y1="-16" x2="18" y2="16" stroke="#FFB74D" stroke-width="1" opacity="0.5"/>
    <line x1="2" y1="5" x2="34" y2="5" stroke="#FFB74D" stroke-width="1" opacity="0.5"/>
    
    <!-- Leaves cluster -->
    <ellipse cx="10" cy="-25" rx="7" ry="5" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5" transform="rotate(-30 10 -25)"/>
    <ellipse cx="18" cy="-28" rx="7" ry="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" transform="rotate(10 18 -28)"/>
  </g>
</svg>